<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Home Base</title>
<style>
  :root { --bg: #e9edf1; --ink: #15202b; --muted: #5d6b78; --accent: #1f6f8b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #10161c; --ink: #e4eaf0; --muted: #93a2b0; --accent: #5fb3cf; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Segoe UI", system-ui, sans-serif; padding: 48px 20px; }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -.01em; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Home Base</h1>
  <p>A personal dashboard I built for my own use. It shows my calendar, coursework, email and to-do list in one place on my computer.</p>
  <p>Home Base is not available to download or sign up for.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
